<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAF9FD;
            color: #111827;
            min-height: 100vh;
            padding-top: 60px;
        }
        .top-bar {
            background-color: #023047;
            padding: 25px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
        }
        .top-nav {
            display: none;
            justify-content: center;
            gap: 10px;
        }
        .top-nav a {
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #FFFFFF;
            border-radius: 8px;
        }
        .top-nav a:hover,
        .top-nav a.active {
            background-color: #FFFFFF;
            color: #000000;
        }
        .main-area {
            padding: 10px;
        }
        .marks-section {
            background-color: #FFFFFF;
            border: 2px solid #023047;
            border-radius: 12px;
            margin: 10px 0;
            padding: 14px;
        }
        .marks-title {
            color: #023047;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #023047;
            padding-bottom: 8px;
            margin-bottom: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .marks-title .title-actions {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .marks-title .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .marks-title .icon-btn:hover {
            background-color: #EAF9FD;
        }
        .marks-title .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #023047;
        }
        .marks-title .delete-btn svg {
            fill: #E0505C;
        }
        .judge-band {
            margin-top: 10px;
            border: 2px solid #023047;
            border-radius: 8px;
            overflow: hidden;
            background-color: #FFFFFF;
        }
        .judge-band-head {
            background-color: #023047;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            padding: 7px 12px;
        }
        .band-delete-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }
        .band-delete-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
        .band-delete-btn svg {
            width: 15px;
            height: 15px;
            fill: #FF8A8A;
        }
        .judge-band-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            border-top: 1px solid #D9EAF2;
            font-size: 15px;
        }
        .judge-band-row:nth-child(even) {
            background-color: #F7FBFF;
        }
        .row-letter {
            color: #023047;
            font-weight: bold;
        }
        .row-marks {
            color: #023047;
            font-weight: bold;
        }
        .result-block {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            padding: 10px;
            background-color: #CAF0F8;
            border: 2px solid #023047;
            border-radius: 8px;
        }
        .result-item {
            color: #023047;
            font-size: 15px;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            color: #667085;
            padding: 30px;
            font-size: 16px;
        }
        .present-btn {
            display: block;
            margin: 14px auto 2px;
            padding: 10px 44px;
            border: none;
            border-radius: 999px;
            background-color: #E0505C;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(2, 48, 71, 0.2);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .present-btn:hover {
            transform: scale(1.03);
        }
        .present-btn.present {
            background-color: #1F9D6B;
        }
        .overall-btn {
            display: block;
            margin: 6px auto 4px;
            padding: 10px 40px;
            border: 2px solid #023047;
            border-radius: 999px;
            background-color: #FFFFFF;
            color: #023047;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .overall-btn:hover,
        .overall-btn.active {
            background-color: #023047;
            color: #FFFFFF;
        }
        .overall-btn.added {
            background-color: #E0505C;
            border-color: #E0505C;
            color: #FFFFFF;
        }
        .overall-submit-btn {
            display: block;
            margin: 12px auto 2px;
            padding: 10px 36px;
            border: none;
            border-radius: 999px;
            background-color: #E0505C;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(2, 48, 71, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .overall-submit-btn.active {
            background-color: #1F9D6B;
        }
        .overall-submit-btn:hover {
            transform: scale(1.03);
        }
        .manual-entry {
            margin-top: 14px;
            border-top: 2px solid #023047;
            padding-top: 12px;
        }
        .manual-title {
            color: #023047;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }
        .manual-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .manual-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .manual-team label {
            color: #023047;
            font-weight: bold;
            font-size: 14px;
        }
        .manual-team input {
            width: 96px;
            padding: 8px;
            border: 2px solid #023047;
            border-radius: 8px;
            font-size: 17px;
            text-align: center;
            color: #023047;
            background-color: #FFFFFF;
        }
        .manual-submit-btn {
            display: block;
            margin: 4px auto 8px;
            padding: 10px 40px;
            border: none;
            border-radius: 999px;
            background-color: #023047;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(2, 48, 71, 0.2);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .manual-submit-btn:hover {
            transform: scale(1.03);
            background-color: #03485F;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background-color: #FFFFFF;
            border-top: 2px solid #000000;
            z-index: 100;
        }
        .bottom-nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            color: #111827;
            text-decoration: none;
            font-size: 12px;
        }
        .bottom-nav a:hover,
        .bottom-nav a.active {
            background-color: #000000;
            color: #FFFFFF;
        }
        .bottom-nav svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        @media (min-width: 768px) {
            .top-nav {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            }
            .top-nav a {
                padding: 4px 16px;
                font-size: 15px;
            }
            .top-bar {
                padding: 14px 20px;
            }
            .bottom-nav {
                display: none;
            }
        }
        @media (max-width: 767px) {
            body {
                padding-top: 50px;
                padding-bottom: 90px;
            }
            #marks-list {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="otb-sync.js"></script>
<script>
const SCHOOL_NAMES = { A: 'Nizamiyya', B: 'Zitouna', C: 'Qurthuba' };
function renderMarks() {
            const programmes = JSON.parse(localStorage.getItem('programmes') || '[]');
            const marksData = JSON.parse(localStorage.getItem('marks') || '{}');
            const presentData = JSON.parse(localStorage.getItem('present') || '{}');
            const overallData = JSON.parse(localStorage.getItem('overall') || '{}');
            const container = document.getElementById('marks-list');
            container.innerHTML = '';

            if (programmes.length === 0) {
                container.innerHTML = '<p class="no-data">No programmes yet.</p>';
                return;
            }

            container.appendChild(buildOverallSection());

            let hasAnyMarks = Object.keys(marksData).length > 0;

            programmes.forEach(function (p) {
                const section = document.createElement('div');
                section.className = 'marks-section';

                const data = marksData[p.name] || {};
                const judges = Object.keys(data);
                const programmeTotal = (p.criteria || []).reduce(function (s, c) {
                    return s + (Number(c.marks) || 0);
                }, 0);

                const avgs = {};
                ['A', 'B', 'C'].forEach(function (letter) {
                    let sum = 0;
                    let count = 0;
                    judges.forEach(function (g) {
                        const e = data[g] && data[g][letter];
                        if (e) {
                            sum += e.total;
                            count += 1;
                        }
                    });
                    avgs[letter] = count ? sum / count : null;
                });

                const title = document.createElement('div');
                title.className = 'marks-title';
                title.innerHTML = '<span>' + p.name + '</span>' +
                    '<span class="title-actions">' +
                    '<a class="icon-btn edit-link" href="edit-marks.html?name=' + encodeURIComponent(p.name) + '">' +
                    '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' +
                    '</a>' +
                    '<span class="icon-btn delete-btn">' +
                    '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
                    '</span>' +
                    '</span>';
                section.appendChild(title);

                section.querySelector('.delete-btn').addEventListener('click', function () {
                    if (!confirm('Clear all marks for "' + p.name + '"?')) return;
                    delete marksData[p.name];
                    localStorage.setItem('marks', JSON.stringify(marksData));
                    Sync.deleteProgrammeMarks(p.name);
                    renderMarks();
                });

                if (judges.length === 0) {
                    const none = document.createElement('p');
                    none.className = 'no-data';
                    none.textContent = 'No marks submitted yet.';
                    section.appendChild(none);
                } else {
                    judges.forEach(function (g) {
                        const band = document.createElement('div');
                        band.className = 'judge-band';
                        let html = '<div class="judge-band-head">' +
                            '<span class="band-gmail">' + g + '</span>' +
                            '<span class="band-delete-btn">' +
                            '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
                            '</span></div>';
                        ['A', 'B', 'C'].forEach(function (letter) {
                            const e = data[g][letter];
                            if (e) {
                                html += '<div class="judge-band-row">' +
                                    '<span class="row-letter">' + SCHOOL_NAMES[letter] + '</span>' +
                                    '<span class="row-marks">' + e.total + ' / ' + programmeTotal + '</span></div>';
                            } else {
                                html += '<div class="judge-band-row">' +
                                    '<span class="row-letter">' + SCHOOL_NAMES[letter] + '</span>' +
                                    '<span class="row-marks" style="color:#9CA3AF;">Not marked</span></div>';
                            }
                        });
                        band.innerHTML = html;
                        band.querySelector('.band-delete-btn').addEventListener('click', function () {
                            if (!confirm('Delete all marks submitted by ' + g + '?')) return;
                            delete data[g];
                            marksData[p.name] = data;
                            localStorage.setItem('marks', JSON.stringify(marksData));
                            Sync.deleteJudgeMarks(p.name, g);
                            renderMarks();
                        });
                        section.appendChild(band);
                    });

                    const result = document.createElement('div');
                    result.className = 'result-block';
                    let rh = '';
                    ['A', 'B', 'C'].forEach(function (letter) {
                        rh += '<span class="result-item">' + SCHOOL_NAMES[letter] + ': ' +
                            (avgs[letter] != null ? avgs[letter].toFixed(1) : '-') + '</span>';
                    });
                    result.innerHTML = rh;
                    section.appendChild(result);
                }

                const btn = document.createElement('button');
                btn.className = 'present-btn' + (presentData[p.name] ? ' present' : '');
                btn.textContent = 'Present';
                btn.addEventListener('click', function () {
                    const wasPresent = presentData[p.name] === true;
                    Object.keys(presentData).forEach(function (k) { presentData[k] = false; });
                    if (!wasPresent) presentData[p.name] = true;
                    localStorage.setItem('present', JSON.stringify(presentData));
                    Sync.savePresent(presentData);
                    db.collection('app').doc('display').set({ mode: null }).catch(function () {});
                    renderMarks();
                });
                section.appendChild(btn);

                const overallBtn = document.createElement('button');
                overallBtn.className = 'present-btn overall-btn' + (overallData[p.name] ? ' added' : '');
                overallBtn.textContent = 'Add to Overall';
                overallBtn.addEventListener('click', function () {
                    overallData[p.name] = !overallData[p.name];
                    localStorage.setItem('overall', JSON.stringify(overallData));
                    Sync.saveOverall(overallData);
                    renderMarks();
                });
                section.appendChild(overallBtn);

                container.appendChild(section);
            });

            if (!hasAnyMarks) {
                const note = document.createElement('p');
                note.className = 'no-data';
                note.textContent = 'No marks submitted yet.';
                container.insertBefore(note, container.firstChild);
            }
        }
        var renderTimer = null;
        function scheduleRender() {
            if (renderTimer) return;
            renderTimer = setTimeout(function () {
                renderTimer = null;
                renderMarks();
            }, 150);
        }
        Promise.all([Sync.loadProgrammes(), Sync.loadAllMarks(), Sync.loadPresent(), Sync.loadOverall(), Sync.loadOverallScores()])
            .then(function () { renderMarks(); })
            .catch(function () { renderMarks(); })
            .then(function () {
                Sync.listenMarks(scheduleRender);
                Sync.listenProgrammes(scheduleRender);
                Sync.listenPresent(scheduleRender);
                Sync.listenOverall(scheduleRender);
                Sync.listenOverallScores(scheduleRender);
            });
        var syncStatus = document.getElementById('sync-status');
        var statusTimer = null;
        function flashStatus(msg) {
            syncStatus.style.display = 'block';
            syncStatus.textContent = msg;
            if (statusTimer) clearTimeout(statusTimer);
            statusTimer = setTimeout(function () {
                syncStatus.style.display = 'none';
            }, 5000);
        }
        db.collection('app').doc('programmes').get()
            .then(function (d) {
                if (d.exists) flashStatus('Connected to the cloud. Live updates are on.');
            })
            .catch(function (err) {
                flashStatus('Cloud sync failed: ' + (err && err.message ? err.message : String(err)) + '. Showing marks saved on this device only.');
            });

        function rankLetters(avgs) {
            const list = ['A', 'B', 'C'].filter(function (l) {
                return avgs[l] != null;
            });
            list.sort(function (a, b) {
                return avgs[b] - avgs[a];
            });
            return list;
        }

        function buildOverallSection() {
            const programmes = JSON.parse(localStorage.getItem('programmes') || '[]');
            const marksData = JSON.parse(localStorage.getItem('marks') || '{}');
            const overallData = JSON.parse(localStorage.getItem('overall') || '{}');
            const presentData = JSON.parse(localStorage.getItem('present') || '{}');
            const anyPresent = Object.keys(presentData).some(function (k) { return presentData[k]; });
            const present = programmes.filter(function (p) {
                return overallData[p.name] === true;
            });
            const section = document.createElement('div');
            section.className = 'marks-section';
            let html = '<div class="marks-title"><span>Overall</span></div>';
            if (present.length === 0) {
                html += '<p class="no-data">No programmes added to Overall yet. Tap "Add to Overall" on a programme to include it.</p>';
            } else {
                const avgs = { A: 0, B: 0, C: 0 };
                let denom = 0;
                let presentCount = 0;
                present.forEach(function (p) {
                    const data = marksData[p.name] || {};
                    const judges = Object.keys(data);
                    if (judges.length === 0) return;
                    presentCount++;
                    const programmeTotal = (p.criteria || []).reduce(function (s, c) {
                        return s + (Number(c.marks) || 0);
                    }, 0);
                    denom += programmeTotal;
                    const pa = { A: 0, B: 0, C: 0 };
                    ['A', 'B', 'C'].forEach(function (letter) {
                        let sum = 0;
                        let count = 0;
                        judges.forEach(function (g) {
                            const e = data[g] && data[g][letter];
                            if (e) {
                                sum += e.total;
                                count += 1;
                            }
                        });
                        pa[letter] = count ? sum / count : null;
                    });
                    ['A', 'B', 'C'].forEach(function (l) {
                        if (pa[l] != null) avgs[l] += pa[l];
                    });
                });
                if (presentCount === 0) {
                    html += '<p class="no-data">Added programmes have no marks yet.</p>';
                } else {
                    const ranked = rankLetters(avgs);
                    html += '<div class="result-block">';
                    if (ranked.length === 0) {
                        html += '<span class="result-item">No marks yet</span>';
                    } else {
                        ranked.forEach(function (letter, i) {
                            const val = avgs[letter] != null ? avgs[letter].toFixed(1) : '-';
                            html += '<span class="result-item">' + (i + 1) + '. ' + SCHOOL_NAMES[letter] + ': ' + val + ' pts</span>';
                        });
                    }
                    html += '</div>';
                    html += '<p class="no-data" style="padding:10px;">Based on ' + presentCount + ' added programme(s).</p>';
                }
            }
            const overallScores = JSON.parse(localStorage.getItem('overallScores') || '{}');
            html += '<div class="manual-entry">' +
                '<div class="manual-title">Enter Overall Scores Manually</div>' +
                '<div class="manual-grid">';
            ['A', 'B', 'C'].forEach(function (l) {
                html += '<div class="manual-team">' +
                    '<label>' + SCHOOL_NAMES[l] + '</label>' +
                    '<input type="number" min="0" step="0.1" id="os-' + l + '" value="' + (overallScores[l] != null ? overallScores[l] : '') + '">' +
                    '</div>';
            });
            html += '</div>' +
                '<button id="submit-scores-btn" class="manual-submit-btn">Submit</button>' +
                '</div>';
            html += '<button id="submit-overall-btn" class="overall-submit-btn' + (anyPresent ? '' : ' active') + '">Submit Overall</button>';
            section.innerHTML = html;
            var msb = section.querySelector('#submit-scores-btn');
            if (msb) {
                msb.addEventListener('click', function () {
                    const map = {};
                    ['A', 'B', 'C'].forEach(function (l) {
                        const inp = section.querySelector('#os-' + l);
                        const v = inp ? inp.value : '';
                        map[l] = v === '' ? null : Number(v);
                    });
                    localStorage.setItem('overallScores', JSON.stringify(map));
                    Sync.saveOverallScores(map)
                        .then(function () {
                            flashStatus('Scores saved. Showing Overall on the audience.');
                        })
                        .catch(function (err) {
                            flashStatus('Save failed: ' + (err && err.message ? err.message : String(err)));
                        });
                    db.collection('app').doc('display').set({ mode: 'overall' })
                        .catch(function (err) {
                            flashStatus('Display failed: ' + (err && err.message ? err.message : String(err)));
                        });
                });
            }
            var sb = section.querySelector('#submit-overall-btn');
            if (sb) {
                sb.addEventListener('click', function () {
                    const presentData = JSON.parse(localStorage.getItem('present') || '{}');
                    Object.keys(presentData).forEach(function (k) { presentData[k] = false; });
                    localStorage.setItem('present', JSON.stringify(presentData));
                    Sync.savePresent(presentData);
                    db.collection('app').doc('display').set({ mode: 'overall' })
                        .then(function () {
                            flashStatus('Overall submitted. Showing on the audience screen.');
                        })
                        .catch(function (err) {
                            flashStatus('Submit failed: ' + (err && err.message ? err.message : String(err)));
                        });
                    renderMarks();
                });
            }
            return section;
        }
    </script>
</body>
</html>
