<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAF9FD;
            min-height: 100vh;
        }
        .top-bar {
            background-color: #023047;
            padding: 25px 20px;
        }
        .bg-area {
            position: relative;
            background-image: url("ChatGPT Image Aug 13, 2026, 01_31_52 PM.png");
            background-size: 105% auto;
            background-position: center top;
            background-repeat: no-repeat;
            min-height: calc(100vh - 50px);
        }
        .welcome-center {
            position: absolute;
            top: calc(50% + 20px);
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 80%;
            max-width: calc(100% - 20px);
        }
        .welcome-title {
            color: #00B4D8;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
        }
        .welcome-sub {
            color: #00B4D8;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .locked-programme {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            width: 100%;
            padding: 0 30px;
            background-color: #FFD60A;
            border: 2px solid #FF8C00;
            border-radius: 999px;
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        @media (min-width: 768px) {
            .top-bar {
                padding: 24px 20px;
            }
            .bg-area {
                background-image: url("ChatGPT Image Aug 13, 2026, 12_59_41 PM.png");
                background-position: center bottom;
                min-height: calc(100vh - 48px);
            }
            .welcome-center {
                top: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>
    <div class="bg-area">
        <div class="welcome-center">
            <h1 class="welcome-title">Welcome to AL-AZHAR's OTB</h1>
            <p class="welcome-sub">Select the programme</p>
            <div id="locked-programme" class="locked-programme"></div>
        </div>
    </div>
    <script>
        function render() {
            const programmes = JSON.parse(localStorage.getItem('programmes') || '[]');
            const locked = programmes.find(function (p) {
                return p.locked;
            });
            const el = document.getElementById('locked-programme');
            el.textContent = locked ? locked.name : '';
            el.style.cursor = locked ? 'pointer' : 'default';
            el.onclick = locked ? function () {
                window.location.href = 'programme.html';
            } : null;
        }
        render();
        setInterval(render, 1000);
    </script>
</body>
</html>
