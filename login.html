<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAF9FD;
            min-height: 100vh;
        }
        .top-bar {
            background-color: #023047;
            padding: 25px 20px;
        }
        .bg-area {
            position: relative;
            background-image: url("ChatGPT Image Aug 13, 2026, 01_31_52 PM.png");
            background-size: 105% auto;
            background-position: center top;
            background-repeat: no-repeat;
            min-height: calc(100vh - 50px);
        }
        .login-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 16px;
        }
        .login-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            padding: 10px 24px 26px;
            width: 100%;
            max-width: 360px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(2, 48, 71, 0.18);
        }
        .login-title {
            color: #023047;
            font-size: 21px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2px;
        }
        .login-sub {
            color: #000000;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-top: 34px;
            margin-bottom: 34px;
        }
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            color: #023047;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #CAF0F8;
            border-radius: 10px;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
            background-color: #FFFFFF;
            color: #023047;
        }
        .field input:focus {
            border-color: #00B4D8;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background-color: #FFD60A;
            border: 2px solid #FF8C00;
            border-radius: 999px;
            color: #023047;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .login-btn:active {
            transform: scale(0.98);
        }
        .error {
            color: #E0505C;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
        }
        @media (min-width: 768px) {
            .top-bar {
                padding: 24px 20px;
            }
            .bg-area {
                background-image: url("ChatGPT Image Aug 13, 2026, 12_59_41 PM.png");
                background-position: center bottom;
                min-height: calc(100vh - 48px);
            }
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>
    <div class="bg-area">
        <div class="login-center">
            <div class="login-card">
                <h1 class="login-title">Welcome to AL-AZHAR's OTB</h1>
                <p class="login-sub">Enter Gmail and Pass from The ID Card</p>
                <form id="login-form">
                    <div class="field">
                        <label for="gmail">Gmail</label>
                        <input id="gmail" type="email" placeholder="Enter your gmail" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="pass">Password</label>
                        <input id="pass" type="password" placeholder="Enter your password" autocomplete="off" required>
                    </div>
                    <button class="login-btn" type="submit">Login</button>
                    <p class="error" id="error"></p>
                </form>
            </div>
        </div>
    </div>
    <script>
        const ACCOUNTS = [
            { gmail: 'azharotb@gmail.com', pass: '12345' },
            { gmail: 'azharotb1@gmail.com', pass: '12344' },
            { gmail: 'azharotb2@gmail.com', pass: '12345' }
        ];

        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const gmail = document.getElementById('gmail').value.trim();
            const pass = document.getElementById('pass').value;
            const stored = JSON.parse(localStorage.getItem('login') || 'null');
            const list = (Array.isArray(stored) && stored.length) ? stored : ACCOUNTS;
            const found = list.find(function (a) {
                return a.gmail.toLowerCase() === gmail.toLowerCase() && a.pass === pass;
            });
            if (found) {
                localStorage.setItem('judgeEmail', found.gmail);
                window.location.href = 'welcome.html';
            } else {
                document.getElementById('error').textContent = 'Incorrect gmail or password';
            }
        });
    </script>
</body>
</html>
