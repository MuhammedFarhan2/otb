<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAF9FD;
            color: #111827;
            min-height: 100vh;
            padding-top: 60px;
        }
        .top-bar {
            background-color: #023047;
            padding: 25px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
        }
        .top-nav {
            display: none;
            justify-content: center;
            gap: 10px;
        }
        .top-nav a {
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #FFFFFF;
            border-radius: 8px;
        }
        .top-nav a:hover,
        .top-nav a.active {
            background-color: #FFFFFF;
            color: #000000;
        }
        .main-area {
            padding: 20px;
        }
        .programme-item {
            display: flex;
            align-items: center;
            position: relative;
            width: calc(100% - 20px);
            margin: 10px 10px 0 10px;
            height: 60px;
            padding: 0 10px 0 25px;
            background-color: #CAF0F8;
            border: 2px solid #023047;
            border-radius: 10px;
            color: #111827;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 6px rgba(2, 48, 71, 0.15);
        }
        .programme-item:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 10px rgba(2, 48, 71, 0.25);
        }
        .programme-lock {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            height: 100%;
            width: 60px;
            border-left: 2px solid #023047;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFFFFF;
            cursor: pointer;
            border-radius: 0 10px 10px 0;
        }
        .programme-lock:hover {
            background-color: #EAF9FD;
        }
        .programme-lock.locked {
            background-color: #000000;
            color: #FFFFFF;
        }
        .programme-lock.locked:hover {
            background-color: #333333;
        }
        .programme-lock svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background-color: #FFFFFF;
            border-top: 2px solid #000000;
            z-index: 100;
        }
        .bottom-nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            color: #111827;
            text-decoration: none;
            font-size: 12px;
        }
        .bottom-nav a:hover,
        .bottom-nav a.active {
            background-color: #000000;
            color: #FFFFFF;
        }
        .bottom-nav svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        @media (min-width: 768px) {
            .top-nav {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            }
            .top-nav a {
                padding: 4px 16px;
                font-size: 15px;
            }
            .top-bar {
                padding: 14px 20px;
            }
            .bottom-nav {
                display: none;
            }
        }
        @media (max-width: 767px) {
            body {
                padding-top: 50px;
                padding-bottom: 90px;
            }
            #programmes-list {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <nav class="top-nav">
            <a href="admin home.html">Home</a>
            <a href="videos.html">Videos</a>
            <a href="remote.html">Remote</a>
            <a href="lock.html" class="active">Lock</a>
            <a href="marks.html">Marks</a>
        </nav>
    </div>
    <div class="main-area">
        <div id="programmes-list"></div>
    </div>
    <nav class="bottom-nav">
        <a href="admin home.html">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
            </svg>
            <span>Home</span>
        </a>
        <a href="videos.html">
            <svg viewBox="0 0 24 24">
                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"></path>
            </svg>
            <span>Videos</span>
        </a>
        <a href="remote.html">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
            </svg>
            <span>Remote</span>
        </a>
        <a href="lock.html" class="active">
            <svg viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>
            </svg>
            <span>Lock</span>
        </a>
        <a href="marks.html">
            <svg viewBox="0 0 24 24">
                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"></path>
            </svg>
            <span>Marks</span>
        </a>
    </nav>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="otb-sync.js"></script>
    <script>
        function renderProgrammes() {
            const programmes = JSON.parse(localStorage.getItem('programmes') || '[]');
            const list = document.getElementById('programmes-list');
            list.innerHTML = '';
            programmes.forEach(function (p, i) {
                const item = document.createElement('a');
                item.href = 'add programme.html?edit=' + i;
                item.className = 'programme-item';

                const nameSpan = document.createElement('span');
                nameSpan.textContent = p.name;

                const lock = document.createElement('span');
                lock.className = 'programme-lock' + (p.locked ? ' locked' : '');
                lock.innerHTML = p.locked
                    ? '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path></svg>'
                    : '<svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"></path></svg>';

                lock.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const programmes = JSON.parse(localStorage.getItem('programmes') || '[]');
                    programmes[i].locked = !programmes[i].locked;
                    localStorage.setItem('programmes', JSON.stringify(programmes));
                    Sync.saveProgrammes(programmes);
                    renderProgrammes();
                });

                item.appendChild(nameSpan);
                item.appendChild(lock);
                list.appendChild(item);
            });
        }
        Sync.loadProgrammes().then(function () { renderProgrammes(); });
    </script>
</body>
</html>
