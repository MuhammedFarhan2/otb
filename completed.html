<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAF9FD;
            min-height: 100vh;
        }
        .top-bar {
            background-color: #023047;
            padding: 25px 20px;
        }
        .bg-area {
            position: relative;
            background-image: url("ChatGPT Image Aug 13, 2026, 01_31_52 PM.png");
            background-size: 105% auto;
            background-position: center top;
            background-repeat: no-repeat;
            min-height: calc(100vh - 50px);
        }
        .completed-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86%;
            max-width: 520px;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 48px 24px;
            min-height: 65vh;
            box-shadow: 0 8px 24px rgba(2, 48, 71, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .check-icon svg {
            display: block;
            width: 90px;
            height: 90px;
        }
        .completed-title {
            color: #111827;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }
        .completed-sub {
            color: #667085;
            font-size: 18px;
            text-align: center;
        }
        @media (min-width: 768px) {
            .top-bar {
                padding: 24px 20px;
            }
            .bg-area {
                background-image: url("ChatGPT Image Aug 13, 2026, 12_59_41 PM.png");
                background-position: center bottom;
                min-height: calc(100vh - 48px);
            }
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>
    <div class="bg-area">
        <div class="completed-center">
            <div class="card">
                <div class="check-icon">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" fill="#0096C7" />
                        <path d="M28 52 L44 68 L74 36" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <h1 class="completed-title">Completed</h1>
                <p class="completed-sub">Thanks for your Judgement</p>
            </div>
        </div>
    </div>
    <script>
        history.pushState({ page: 'completed' }, '', location.href);
        window.addEventListener('popstate', function () {
            history.pushState({ page: 'completed' }, '', location.href);
        });
    </script>
</body>
</html>
